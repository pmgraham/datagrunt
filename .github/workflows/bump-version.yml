name: Bump Version

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "rust/**"
  workflow_dispatch:
    inputs:
      part:
        description: "The part of the version to bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  bump-version:
    name: Bump version
    runs-on: ubuntu-latest

    steps:
      # Mint a short-lived token from a GitHub App (contents:write) instead of a
      # long-lived PAT (#242). The token is generated per run and cannot expire.
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          # Check out with the App token so the bump commit/push is made with it:
          # a push made with the default GITHUB_TOKEN does NOT trigger the
          # downstream "Publish to PyPI" workflow_run, but an App-token push does.
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install bumpver
        run: pip install bumpver

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes
        run: git pull origin main

      - name: Determine version bump type
        id: version_type
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qi "\[major\]"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qi "\[minor\]"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qi "\[patch\]"; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        run: bumpver update --${{ github.event.inputs.part || steps.version_type.outputs.type }}
