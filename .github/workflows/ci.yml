name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: cargo + pytest (both backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Install tesseract (for PDF OCR tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Create venv, build the extension (editable), install dev/pdf extras
        # Explicit venv + editable install (uv handles maturin build isolation
        # automatically). We then call .venv/bin/<tool> directly rather than
        # `uv run`, which would re-sync the project env and drop the editable
        # install + dev extras (that was the earlier "pytest: not found" failure).
        run: |
          uv venv --clear   # setup-uv already created .venv; --clear makes this idempotent
          uv pip install -e ".[dev,pdf]"

      - name: cargo test
        working-directory: rust
        env:
          CARGO_NET_RETRY: "10" # tolerate transient crates.io HTTP/2 fetch flakes
        run: cargo test

      - name: cargo clippy (blocking)
        working-directory: rust
        env:
          CARGO_NET_RETRY: "10"
        run: cargo clippy --all-targets -- -D warnings

      - name: pytest (Rust backend)
        run: .venv/bin/pytest tests/ -q

      - name: pytest (Python fallback backend)
        env:
          DATAGRUNT_DISABLE_RUST: "1"
        run: .venv/bin/pytest tests/ -q

      - name: ruff lint (src + tests — blocking)
        run: .venv/bin/ruff check src tests

      - name: ruff format check (blocking)
        run: .venv/bin/ruff format --check .

  python-compat:
    # The main test job covers 3.12; this proves the rest of the advertised
    # range (requires-python >= 3.10, classifiers through 3.14). The native
    # extension is abi3-py310, so this mostly exercises the pure-Python paths
    # (the whole PDF subsystem) and the dependency set per version.
    name: python compat
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tesseract (for PDF OCR tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Create venv, build the extension (editable), install dev/pdf extras
        run: |
          uv venv --clear
          uv pip install -e ".[dev,pdf]"

      - name: pytest (Rust backend)
        run: .venv/bin/pytest tests/ -q

      - name: pytest (Python fallback backend)
        env:
          DATAGRUNT_DISABLE_RUST: "1"
        run: .venv/bin/pytest tests/ -q

  build:
    name: wheel matrix
    uses: ./.github/workflows/build.yml

  audit:
    name: dependency audit (advisory)
    runs-on: ubuntu-latest
    # Advisory, NOT blocking: a newly published advisory in a transitive
    # dependency (duckdb, polars, pyarrow, pymupdf, …) must not break CI or the
    # release path overnight. Findings surface in the step logs; promote to
    # blocking once a clean baseline + an ignore-list of accepted advisories is
    # curated (RUSTSEC-* / GHSA-* / PYSEC-*).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: cargo audit
        continue-on-error: true
        working-directory: rust
        env:
          CARGO_NET_RETRY: "10"
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: pip-audit
        continue-on-error: true
        # Audit the project's resolved dependency tree (installed into the venv).
        # ``pip`` is installed alongside because pip-audit's environment source
        # enumerates installed dists via pip (uv venvs omit pip by default).
        run: |
          uv venv --clear
          uv pip install -e . pip-audit pip
          .venv/bin/pip-audit
