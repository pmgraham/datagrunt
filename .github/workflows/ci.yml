name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: cargo + pytest (both backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install tesseract (for PDF OCR tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Build the extension (editable) + dev/pdf extras
        # --with maturin: maturin lives in the dev extra, which isn't installed
        # yet, so `uv run maturin` can't spawn it on a fresh runner. --with makes
        # maturin available for this invocation; maturin develop then installs
        # the project (incl. dev,pdf extras) into the uv-managed venv.
        run: uv run --with maturin maturin develop --release --extras dev,pdf

      - name: cargo test
        working-directory: rust
        run: cargo test

      - name: pytest (Rust backend)
        run: uv run pytest tests/ -q

      - name: pytest (Python fallback backend)
        env:
          DATAGRUNT_DISABLE_RUST: "1"
        run: uv run pytest tests/ -q

      - name: differential parity (Rust vs Python reference)
        run: uv run pytest rust/parity -q --no-cov

      - name: ruff (owned dirs — blocking)
        run: uv run ruff check src/datagrunt/core/csv_io rust/parity

      - name: ruff (full src — informational)
        run: uv run ruff check src/datagrunt || true

  build:
    name: wheel matrix
    uses: ./.github/workflows/build.yml
