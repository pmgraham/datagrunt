name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on rapid PR force-pushes or back-to-back merges on main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Fail-closed path filter (#504): skip heavy Rust/pytest/wheel CI only when
    # every changed file is a non-packaged repo doc/meta file. README.md,
    # LICENSE, THIRD_PARTY_NOTICES.txt, Auto Document Updater scripts, workflows,
    # and any new/unknown paths always run full CI.
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          SKIP_EXACT = frozenset(
              {
                  "CLAUDE.md",
                  "GEMINI.md",
                  "CHANGELOG.md",
                  "CONTRIBUTING.md",
                  "CODE_OF_CONDUCT.md",
                  "SECURITY.md",
                  ".gitignore",
                  ".github/CODEOWNERS",
                  ".github/PULL_REQUEST_TEMPLATE.md",
              }
          )
          SKIP_PREFIXES = (
              ".github/ISSUE_TEMPLATE/",
              ".github/PULL_REQUEST_TEMPLATE/",
              "docs/",
          )

          def emit(run_ci: bool, reason: str) -> None:
              val = "true" if run_ci else "false"
              print(f"run_ci={val} ({reason})")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"run_ci={val}\n")

          def is_skip_only(path: str) -> bool:
              return path in SKIP_EXACT or path.startswith(SKIP_PREFIXES)

          event = os.environ.get("EVENT_NAME", "")
          if event == "workflow_dispatch":
              emit(True, "manual workflow_dispatch always runs full CI")
              sys.exit(0)

          if event == "pull_request":
              # actions/checkout checks out refs/pull/N/merge whose parents are
              # base (HEAD^1) and PR head (HEAD^2). Fail closed if not a merge.
              check = subprocess.run(["git", "rev-parse", "--verify", "-q", "HEAD^2"], capture_output=True)
              if check.returncode != 0:
                  emit(True, "HEAD is not a PR merge commit; failing closed")
                  sys.exit(0)
              diff_cmd = ["git", "diff", "--name-only", "-z", "HEAD^1", "HEAD"]
          elif event == "push":
              before = os.environ.get("PUSH_BEFORE", "")
              head = os.environ.get("HEAD_SHA", "")
              if not before or set(before) == {"0"}:
                  emit(True, "no prior push SHA; failing closed")
                  sys.exit(0)
              check = subprocess.run(["git", "cat-file", "-e", f"{before}^{{commit}}"], capture_output=True)
              if check.returncode != 0:
                  emit(True, "prior push SHA unavailable; failing closed")
                  sys.exit(0)
              diff_cmd = ["git", "diff", "--name-only", "-z", before, head]
          else:
              emit(True, f"unhandled event {event!r}; failing closed")
              sys.exit(0)

          res = subprocess.run(diff_cmd, capture_output=True)
          if res.returncode != 0:
              emit(True, f"git diff exited {res.returncode}; failing closed")
              sys.exit(0)

          paths = [p.decode("utf-8", errors="surrogateescape") for p in res.stdout.split(b"\0") if p]
          if not paths:
              emit(True, "no changed files detected; failing closed")
              sys.exit(0)

          triggering = [p for p in paths if not is_skip_only(p)]
          if triggering:
              emit(True, f"CI-relevant files changed: {', '.join(triggering[:10])}")
          else:
              emit(False, f"only non-CI docs/meta files changed: {', '.join(paths)}")
          PY

  test:
    name: cargo + pytest (both backends)
    needs: [changes]
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    env:
      # PEP 669 low-overhead line monitoring on Python 3.12+.
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-py3.12-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-py3.12-

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: "true"
          cache-dependency-glob: |
            pyproject.toml
            rust/Cargo.toml
            rust/Cargo.lock

      - name: Install tesseract (for PDF OCR tests)
        # Fall back to GPG-verified mirrors.edge.kernel.org when Azure runners hit *.ubuntu.com DNS outages.
        run: |
          use_kernel_mirror() {
            echo "https://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              if [ -f "$f" ]; then
                sudo sed -i -E 's|https?://[A-Za-z0-9.-]*ubuntu\.com/ubuntu/?|https://mirrors.edge.kernel.org/ubuntu/|g' "$f"
              fi
            done
          }
          if ! getent ahosts archive.ubuntu.com >/dev/null 2>&1 || ! getent ahosts security.ubuntu.com >/dev/null 2>&1; then
            use_kernel_mirror
          fi
          APT_FAST="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          if ! sudo apt-get update $APT_FAST || ! sudo apt-get install -y $APT_FAST tesseract-ocr; then
            use_kernel_mirror
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y -o Acquire::Retries=3 tesseract-ocr
          fi

      - name: Create venv, build the extension (editable), install dev/pdf/rationalize extras
        # Explicit venv + editable install (uv handles maturin build isolation
        # automatically). --reinstall-package datagrunt forces maturin to link
        # fresh Rust changes from rust/target (cached by actions/cache) instead
        # of ever serving a stale editable wheel from uv's wheel cache.
        run: |
          uv venv --clear   # setup-uv already created .venv; --clear makes this idempotent
          uv pip install --reinstall-package datagrunt -e ".[dev,pdf,rationalize]"

      - name: cargo test
        working-directory: rust
        env:
          CARGO_NET_RETRY: "10" # tolerate transient crates.io HTTP/2 fetch flakes
        run: cargo test

      - name: cargo clippy (blocking)
        working-directory: rust
        env:
          CARGO_NET_RETRY: "10"
        run: cargo clippy --all-targets -- -D warnings

      # The Rust counterpart to the `ruff format --check` gate below. rustfmt
      # needs no dependency resolution, so no CARGO_NET_RETRY here.
      - name: cargo fmt check (blocking)
        working-directory: rust
        run: cargo fmt --check

      - name: pytest (Rust backend)
        run: |
          .venv/bin/pytest -n logical --dist=worksteal -m "not corpus and not live and not no_cover" --cov-fail-under=95 tests/ -q
          .venv/bin/pytest -p no:cov -o addopts="" -m "no_cover and not corpus and not live" tests/ -q

      - name: pytest (Python fallback backend)
        env:
          DATAGRUNT_DISABLE_RUST: "1"
        run: |
          .venv/bin/pytest -n logical --dist=worksteal -m "not corpus and not live and not no_cover" --cov-fail-under=95 tests/ -q
          .venv/bin/pytest -p no:cov -o addopts="" -m "no_cover and not corpus and not live" tests/ -q

      - name: ruff lint (src + tests — blocking)
        run: .venv/bin/ruff check src tests

      - name: ruff format check (blocking)
        run: .venv/bin/ruff format --check .

      # Whole-tree gate: files = ["src/datagrunt"] under [tool.mypy] covers
      # every module, with check_untyped_defs on for unannotated bodies.
      - name: "mypy (blocking — whole tree)"
        run: .venv/bin/mypy

      # The pytest stub guard compares name sets only; stubtest compares
      # signatures, so a Rust arity/type change cannot ship a stale stub.
      - name: "stubtest (blocking — _native.pyi vs compiled module)"
        run: .venv/bin/python -m mypy.stubtest datagrunt._native --ignore-positional-only

  python-compat:
    # The main test job covers 3.12; this proves the rest of the advertised
    # range (requires-python >= 3.11, classifiers through 3.15). The native
    # extension is abi3-py311, so this mostly exercises the pure-Python paths
    # (the whole PDF subsystem) and the dependency set per version.
    # Skipped on post-merge push to main: ruleset requires PRs for main, where
    # this matrix already ran.
    name: python compat
    needs: [changes]
    if: github.event_name != 'push' && needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14", "3.15"]
    env:
      # PEP 669 sys.monitoring is available on 3.12+ (3.13, 3.14, 3.15); 3.11 uses ctrace.
      COVERAGE_CORE: ${{ matrix.python-version != '3.11' && 'sysmon' || 'ctrace' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-py${{ matrix.python-version }}-

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: "true"
          cache-dependency-glob: |
            pyproject.toml
            rust/Cargo.toml
            rust/Cargo.lock

      - name: Install tesseract (for PDF OCR tests)
        # Fall back to GPG-verified mirrors.edge.kernel.org when Azure runners hit *.ubuntu.com DNS outages.
        run: |
          use_kernel_mirror() {
            echo "https://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              if [ -f "$f" ]; then
                sudo sed -i -E 's|https?://[A-Za-z0-9.-]*ubuntu\.com/ubuntu/?|https://mirrors.edge.kernel.org/ubuntu/|g' "$f"
              fi
            done
          }
          if ! getent ahosts archive.ubuntu.com >/dev/null 2>&1 || ! getent ahosts security.ubuntu.com >/dev/null 2>&1; then
            use_kernel_mirror
          fi
          APT_FAST="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          if ! sudo apt-get update $APT_FAST || ! sudo apt-get install -y $APT_FAST tesseract-ocr; then
            use_kernel_mirror
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y -o Acquire::Retries=3 tesseract-ocr
          fi

      - name: Create venv, build the extension (editable), install dev/pdf/rationalize extras
        run: |
          uv venv --clear
          uv pip install --reinstall-package datagrunt -e ".[dev,pdf,rationalize]"

      - name: pytest (Rust backend)
        run: |
          .venv/bin/pytest -n logical --dist=worksteal -m "not corpus and not live and not no_cover" --cov-fail-under=95 tests/ -q
          .venv/bin/pytest -p no:cov -o addopts="" -m "no_cover and not corpus and not live" tests/ -q

      - name: pytest (Python fallback backend)
        env:
          DATAGRUNT_DISABLE_RUST: "1"
        run: |
          .venv/bin/pytest -n logical --dist=worksteal -m "not corpus and not live and not no_cover" --cov-fail-under=95 tests/ -q
          .venv/bin/pytest -p no:cov -o addopts="" -m "no_cover and not corpus and not live" tests/ -q

  build:
    # Skipped on post-merge push to main: every PR already builds all wheels +
    # sdist as required checks, and Publish to PyPI builds release artifacts
    # after Bump Version completes.
    name: wheel matrix
    needs: [changes]
    if: github.event_name != 'push' && needs.changes.outputs.run_ci == 'true'
    uses: ./.github/workflows/build.yml

  audit:
    name: dependency audit (advisory)
    needs: [changes]
    if: github.event_name != 'push' && needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    # Advisory, NOT blocking: a newly published advisory in a transitive
    # dependency (duckdb, polars, pyarrow, pypdfium2, …) must not break CI or the
    # release path overnight. Findings surface in the step logs; promote to
    # blocking once a clean baseline + an ignore-list of accepted advisories is
    # curated (RUSTSEC-* / GHSA-* / PYSEC-*).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo-audit binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-v1

      - name: cargo audit
        continue-on-error: true
        working-directory: rust
        env:
          CARGO_NET_RETRY: "10"
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
          cargo audit

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: "true"
          cache-dependency-glob: |
            pyproject.toml
            rust/Cargo.toml
            rust/Cargo.lock

      - name: pip-audit
        continue-on-error: true
        # Audit the project's resolved dependency tree (installed into the venv).
        # ``pip`` is installed alongside because pip-audit's environment source
        # enumerates installed dists via pip (uv venvs omit pip by default).
        run: |
          uv venv --clear
          uv pip install --reinstall-package datagrunt -e . pip-audit pip
          .venv/bin/pip-audit

  ci-gate:
    # Single always-run status check for branch rulesets (#504). Passes
    # immediately when `changes` skips heavy jobs for non-packaged docs/meta
    # edits; otherwise requires `test` and (on non-push) `build` to succeed.
    name: CI gate
    if: always()
    needs: [changes, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_CI: ${{ needs.changes.outputs.run_ci }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "event=$EVENT_NAME changes=$CHANGES_RESULT run_ci=$RUN_CI test=$TEST_RESULT build=$BUILD_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::detect changed paths job did not succeed ($CHANGES_RESULT)"
            exit 1
          fi
          if [ "$RUN_CI" != "true" ]; then
            echo "Heavy CI jobs skipped for non-code / non-README docs-only change."
            exit 0
          fi
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::cargo + pytest (both backends) did not succeed ($TEST_RESULT)"
            exit 1
          fi
          if [ "$EVENT_NAME" != "push" ] && [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::wheel matrix did not succeed ($BUILD_RESULT)"
            exit 1
          fi
          echo "All required CI jobs succeeded."
