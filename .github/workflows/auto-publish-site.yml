name: Auto Update Docs & Blog

on:
  # Chain off the APPROVED PyPI publish, not the version bump, so the release
  # post can never precede the maintainer's consent at the gated PyPi
  # environment (#305). A rejected or failed publish never posts. The chain
  # push (bump) -> Publish to PyPI -> this stays within GitHub's three-level
  # workflow_run limit. (A tag trigger cannot work for releases: bumpver's
  # tags point at the bump commit, whose "[skip ci]" message suppresses all
  # push-triggered workflows — #275; the old v* fallback is gone with the
  # v-prefixed tags.)
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
    branches: [main]
  # Manual fallback: dispatch from the Actions tab.
  workflow_dispatch:

# Read-only on THIS repo — the datagrunt-site push uses the scoped App token
# minted below, never the workflow's GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  update-docs:
    runs-on: ubuntu-latest
    # Post only for the automated release chain: the publish run must have
    # succeeded AND itself been workflow_run-triggered (i.e. the real-PyPI
    # path off Bump Version). Manual publish dispatches — e.g. TestPyPI
    # smoke publishes — never generate a release post; dispatch this
    # workflow manually if a post is wanted for one.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'workflow_run') }}
    steps:
      - name: Checkout datagrunt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          path: datagrunt
          fetch-depth: 0

      # Mint a short-lived token for the sister datagrunt-site repo from a
      # dedicated GitHub App (contents:write on datagrunt-site) instead of a
      # long-lived PAT (#271). The default GITHUB_TOKEN cannot write another repo.
      - name: Mint a GitHub App token for datagrunt-site
        id: site-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SITE_APP_ID }}
          private-key: ${{ secrets.SITE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: datagrunt-site

      - name: Checkout datagrunt-site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: pmgraham/datagrunt-site
          token: ${{ steps.site-token.outputs.token }}
          path: datagrunt-site

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          # setup-uv >= 6 no longer provides an implicit environment for
          # `uv pip install`; create and activate one so the install step and
          # the bare `python` invocation below keep working (broke in the
          # v5 -> v9 bump: "No virtual environment found").
          activate-environment: true

      - name: Install dependencies
        # Pinned: these feed an AI agent that commits to datagrunt-site, so an
        # unpinned install is a supply-chain soft spot. Dependabot bumps them.
        run: |
          uv pip install google-antigravity==0.1.7 python-dotenv==1.2.2

      - name: Run Antigravity Workflow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Diff against the previous release tag so the post covers the whole
        # release, not just the commit before HEAD. Tags for the version being
        # released are excluded so a backfill run (HEAD already tagged) still
        # finds the prior release; with no prior tag, fall back to HEAD~1.
        run: |
          VERSION=$(grep -m1 '^current_version = ' datagrunt/pyproject.toml | cut -d'"' -f2)
          PREV_TAG=$(git -C datagrunt describe --tags --abbrev=0 \
            --exclude="$VERSION" --exclude="v$VERSION" HEAD 2>/dev/null || echo "HEAD~1")
          echo "Documenting version $VERSION (diff base: $PREV_TAG)"
          python datagrunt/scripts/antigravity_workflow.py --pre-merge-commit "$PREV_TAG"

      - name: Commit and Push Docs Update
        working-directory: datagrunt-site
        # Read the version from the datagrunt checkout — this step runs inside
        # datagrunt-site, where `git log` would return the site's own history.
        run: |
          VERSION=$(grep -m1 '^current_version = ' "$GITHUB_WORKSPACE/datagrunt/pyproject.toml" | cut -d'"' -f2)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git diff-index --quiet HEAD || git commit -m "docs: release blog post for version $VERSION"
          git push origin main
