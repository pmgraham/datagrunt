name: Build wheels

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.target }} ${{ matrix.musl && 'musl' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,        target: aarch64-apple-darwin,     manylinux: auto,         musl: false }
          - { os: macos-13,        target: x86_64-apple-darwin,      manylinux: auto,         musl: false }
          - { os: ubuntu-latest,   target: x86_64,                   manylinux: auto,         musl: false }
          - { os: ubuntu-24.04-arm, target: aarch64,                 manylinux: auto,         musl: false }
          - { os: ubuntu-latest,   target: x86_64,                   manylinux: musllinux_1_2, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64,                 manylinux: musllinux_1_2, musl: true }
          - { os: windows-latest,  target: x86_64-pc-windows-msvc,   manylinux: auto,         musl: false }
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
          sccache: "true"

      - name: Smoke test (host) — non-musl
        if: ${{ !matrix.musl }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links=dist datagrunt
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"

      - name: Smoke test (Alpine container) — musllinux
        if: ${{ matrix.musl }}
        run: |
          docker run --rm -v "$PWD:/io" -w /io python:3.12-alpine sh -c "
            pip install --find-links=dist datagrunt &&
            cd /tmp && python /io/scripts/smoke_wheel.py
          "

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}-${{ matrix.musl && 'musl' || 'gnu' }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
