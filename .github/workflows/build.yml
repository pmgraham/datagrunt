name: Build wheels

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # musllinux is intentionally omitted: duckdb (a mandatory dependency) ships
    # no musllinux wheel, so `pip install datagrunt` can't resolve in slim Alpine
    # regardless of our wheel. Revisit when duckdb publishes musllinux wheels.
    # x86_64-apple-darwin (Intel Mac) is intentionally omitted: GitHub's macos-13
    # runner pool chronically queues these jobs for tens of minutes, and Intel
    # Macs are effectively obsolete. Intel-Mac users install from the sdist.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         target: aarch64-apple-darwin,   manylinux: auto }
          - { os: ubuntu-latest,    target: x86_64,                 manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64,                manylinux: auto }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc, manylinux: auto }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
          sccache: "true"
          # Pin maturin for reproducible builds.
          maturin-version: v1.14.0

      - name: Smoke test the wheel (host)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Install the freshly built wheel BY PATH so pip can't substitute a
          # higher-versioned pure-Python release from PyPI (which lacks _native).
          # Dependencies still resolve from PyPI.
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"

      # No twine check on wheels: the manylinux container's maturin emits license
      # metadata that the latest twine/packaging rejects but PyPI accepts (the
      # 4.0.0 linux wheels are live). The sdist (the file that actually broke) is
      # built on the host and twine-checked below.
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Build the sdist on the host (it is pure source — no manylinux container
      # needed). The host maturin emits canonical Metadata-Version 2.4 license
      # metadata that passes strict twine/packaging validation; the container's
      # older maturin does not. This is the file PyPI rejected for 4.0.0.
      - name: Build + validate sdist
        run: |
          python -m pip install --upgrade "maturin>=1.7,<2.0" twine
          maturin sdist --out dist
          twine check dist/*.tar.gz
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
