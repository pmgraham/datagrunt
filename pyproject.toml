[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "datagrunt"
version = "4.0.7"
description = "Read CSV files and convert to other file formats easily"
readme = "README.md"
authors = [{ name = "Martin Graham", email = "datagrunt@datagrunt.io" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["csv", "data", "duckdb", "polars", "pyarrow", "xlsx", "delimiter", "pdf"]
dependencies = [
    "duckdb>=1.5.3",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "XlsxWriter>=3.2.9",
]
requires-python = ">=3.10"

[project.optional-dependencies]
pdf = [
    "PyMuPDF>=1.27.2",
    "pdfplumber>=0.11.9",
    "pytesseract>=0.3.13",
    "Pillow>=12.2.0",
    "pypdfium2>=5.9.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
    "bumpver>=2026.1132",
    "fastexcel>=0.20.2",
    "maturin>=1.7,<2.0",
]

[project.urls]
Homepage = "https://www.datagrunt.io/"
"Bug Tracker" = "https://github.com/pmgraham/datagrunt/issues"
Documentation = "https://www.datagrunt.io/"
"Source Code" = "https://github.com/pmgraham/datagrunt"

[tool.maturin]
python-source = "src"
module-name = "datagrunt._native"
manifest-path = "rust/datagrunt-python/Cargo.toml"

[tool.bumpver]
current_version = "4.0.7"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "build: bump version {old_version} -> {new_version} [skip ci]"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"src/datagrunt/__init__.py" = [
    '^__version__ = "{version}"$',
]

[tool.pytest.ini_options]
testpaths = "tests"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src/datagrunt --cov-report=term-missing -m 'not corpus'"
pythonpath = "."
markers = [
    "corpus: slow, local-only cross-engine tests over the data/pdfs corpus (deselected by default; run with -m corpus)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = ["E203"]