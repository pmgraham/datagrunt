[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "datagrunt"
version = "4.5.11"
description = "Read, process, and convert CSV, Excel, Parquet, and PDF files easily"
readme = "README.md"
authors = [{ name = "Martin Graham", email = "datagrunt@datagrunt.io" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["csv", "data", "duckdb", "polars", "pyarrow", "xlsx", "delimiter", "pdf"]
dependencies = [
    "duckdb>=1.5.3",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "XlsxWriter>=3.2.9",
    "fastexcel>=0.20.2",
]
requires-python = ">=3.10"

[project.optional-dependencies]
pdf = [
    "PyMuPDF>=1.27.2",
    "pdfplumber>=0.11.9",
    "pytesseract>=0.3.13",
    "Pillow>=12.2.0",
    "pypdfium2>=5.9.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    # Upper-bounded deliberately: ruff's formatter output is a moving target by
    # design (0.16 began formatting Python inside Markdown, #312), and CI gates
    # on `ruff format --check`. Unbounded, a formatter release breaks CI on
    # untouched code. Runtime deps stay unbounded (see #307); dev tools do not.
    "ruff>=0.15.17,<0.17",
    # Upper-bounded the same way as ruff (#312): allow the current minor,
    # exclude the next. mypy adds default-on error codes in 1.x minor
    # releases, and this gate is blocking.
    "mypy>=1.14,<1.21",
    "bumpver>=2026.1132",
    "maturin>=1.7,<2.0",
    "pre-commit>=4.0.0",
    # Pinned to a SINGLE minor — deliberately tighter than ruff (<0.17, two
    # minors) and mypy (<1.21, seven), so do not read those as precedent for
    # this bound. Two reasons for the extra tightness. Hypothesis's
    # compatibility guarantee covers the DOCUMENTED API only, and validation
    # strictness tightens in ordinary minors (6.140.0 made
    # characters(exclude_characters=...) reject multi-char strings; 6.136.2 made
    # @precondition without @rule raise) — either reddens this blocking gate on
    # untouched code. More important, tests/parity/test_parity_strategies.py's
    # vacuity guard asserts on the GENERATION DISTRIBUTION, which is not part of
    # any compatibility promise and shifts freely between minors. Reproducible
    # parity search is worth the cost, and the cost is real: Hypothesis ships
    # minors roughly weekly, so expect near-continuous Dependabot bumps here.
    # Take them one at a time and re-run the parity suite on each.
    "hypothesis>=6.164.0,<6.165",
]

[project.urls]
Homepage = "https://www.datagrunt.io/"
"Bug Tracker" = "https://github.com/pmgraham/datagrunt/issues"
Documentation = "https://www.datagrunt.io/"
"Source Code" = "https://github.com/pmgraham/datagrunt"

[tool.maturin]
python-source = "src"
module-name = "datagrunt._native"
manifest-path = "rust/datagrunt-python/Cargo.toml"

[tool.bumpver]
current_version = "4.5.11"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "build: bump version {old_version} -> {new_version} [skip ci]"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"src/datagrunt/__init__.py" = [
    '^__version__ = "{version}"$',
]

[tool.pytest.ini_options]
testpaths = "tests"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src/datagrunt --cov-report=term-missing -m 'not corpus'"
pythonpath = "."
# No `deep` marker on purpose. The scheduled deep search selects its work by
# Hypothesis profile (HYPOTHESIS_PROFILE=deep) and file path, never by marker,
# so registering one would only create a trap: a `deep`-marked test would be
# deselected by this addopts AND unselected by the deep job, and would run
# nowhere. Depth is a profile, not a marker.
markers = [
    "corpus: slow, local-only cross-engine tests over the data/pdfs corpus (deselected by default; run with -m corpus)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
# ruff 0.16 formats Python inside Markdown fences. Docs are hand-authored:
# the README aligns trailing comments across example lines for readability,
# which the formatter collapses. The gate exists to keep *source* consistent,
# so it stops at source. See #312.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
# Whole-tree, blocking (the ratchet from the original 3-file compute-contract
# scope is now complete). check_untyped_defs keeps unannotated bodies
# checked; the strict disallow_untyped_defs override below holds the
# compute contract to full annotations.
files = ["src/datagrunt"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Listed explicitly rather than as `..._compute*`: mypy only accepts `*` as a
# whole dotted component, and rejects a partial-component pattern with a
# *warning* while still exiting 0 — a silently unenforced override. These are
# the compute-backend-contract modules held to the stricter bar: the oracle is
# annotated to the ComputeBackendProtocol, so the TYPE_CHECKING conformance
# assignment in _compute.py enforces its signatures, not just its members.
[[tool.mypy.overrides]]
module = [
    "datagrunt._native",
    "datagrunt.core.csv_io._compute",
    "datagrunt.core.csv_io._compute_protocol",
    "datagrunt.core.csv_io._compute_python",
]
disallow_untyped_defs = true

# Third-party libraries with no stubs/py.typed marker. Silenced here (never
# via inline `# type: ignore`) so every suppression is visible in one place.
# Extend this list only when the whole-tree run actually names a new one.
# pyarrow is the odd one out: its py.typed marker is version-dependent, not
# absent outright. The dependency floor is pyarrow>=24.0.0 (unbounded); 24.0.0
# ships py.typed (mypy sees it locally and uses real types — this override is
# inert there), but a fresh resolve can land on a newer release (e.g. 25.0.0)
# whose py.typed isn't visible to mypy, which is exactly what CI hit. Safe in
# both cases: ignore_missing_imports only silences the "missing stubs"
# diagnostic, it never substitutes Any for a type mypy can actually resolve.
[[tool.mypy.overrides]]
module = ["pytesseract.*", "pypdfium2.*", "xlsxwriter.*", "pyarrow.*"]
ignore_missing_imports = true
