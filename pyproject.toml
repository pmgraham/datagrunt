[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "datagrunt"
version = "4.5.6"
description = "Read, process, and convert CSV, Excel, Parquet, and PDF files easily"
readme = "README.md"
authors = [{ name = "Martin Graham", email = "datagrunt@datagrunt.io" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["csv", "data", "duckdb", "polars", "pyarrow", "xlsx", "delimiter", "pdf"]
dependencies = [
    "duckdb>=1.5.3",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "XlsxWriter>=3.2.9",
    "fastexcel>=0.20.2",
]
requires-python = ">=3.10"

[project.optional-dependencies]
pdf = [
    "PyMuPDF>=1.27.2",
    "pdfplumber>=0.11.9",
    "pytesseract>=0.3.13",
    "Pillow>=12.2.0",
    "pypdfium2>=5.9.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    # Upper-bounded deliberately: ruff's formatter output is a moving target by
    # design (0.16 began formatting Python inside Markdown, #312), and CI gates
    # on `ruff format --check`. Unbounded, a formatter release breaks CI on
    # untouched code. Runtime deps stay unbounded (see #307); dev tools do not.
    "ruff>=0.15.17,<0.17",
    # Upper-bounded the same way as ruff (#312): allow the current minor,
    # exclude the next. mypy adds default-on error codes in 1.x minor
    # releases, and this gate is blocking.
    "mypy>=1.14,<1.21",
    "bumpver>=2026.1132",
    "maturin>=1.7,<2.0",
    "pre-commit>=4.0.0",
]

[project.urls]
Homepage = "https://www.datagrunt.io/"
"Bug Tracker" = "https://github.com/pmgraham/datagrunt/issues"
Documentation = "https://www.datagrunt.io/"
"Source Code" = "https://github.com/pmgraham/datagrunt"

[tool.maturin]
python-source = "src"
module-name = "datagrunt._native"
manifest-path = "rust/datagrunt-python/Cargo.toml"

[tool.bumpver]
current_version = "4.5.6"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "build: bump version {old_version} -> {new_version} [skip ci]"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"src/datagrunt/__init__.py" = [
    '^__version__ = "{version}"$',
]

[tool.pytest.ini_options]
testpaths = "tests"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src/datagrunt --cov-report=term-missing -m 'not corpus'"
pythonpath = "."
markers = [
    "corpus: slow, local-only cross-engine tests over the data/pdfs corpus (deselected by default; run with -m corpus)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
# ruff 0.16 formats Python inside Markdown fences. Docs are hand-authored:
# the README aligns trailing comments across example lines for readability,
# which the formatter collapses. The gate exists to keep *source* consistent,
# so it stops at source. See #312.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
# Scoped deliberately. #314 tracks widening this to the public API surface;
# checking the whole tree today surfaces 42 mypy errors (13 import-untyped
# for third-party libs without stubs, 29 substantive) in one change.
files = [
    "src/datagrunt/core/csv_io/_compute.py",
    "src/datagrunt/core/csv_io/_compute_protocol.py",
    "src/datagrunt/_native.pyi",
]
warn_unused_ignores = true
warn_redundant_casts = true

# Listed explicitly rather than as `..._compute*`: mypy only accepts `*` as a
# whole dotted component, and rejects a partial-component pattern with a
# *warning* while still exiting 0 — a silently unenforced override. These are
# the scoped modules above; `_compute_python` is excluded on purpose (the
# oracle is unannotated, and annotating it is #314's job, not this gate's).
[[tool.mypy.overrides]]
module = [
    "datagrunt._native",
    "datagrunt.core.csv_io._compute",
    "datagrunt.core.csv_io._compute_protocol",
]
disallow_untyped_defs = true
